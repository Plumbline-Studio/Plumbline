name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Every JavaScript file must parse.
      - name: JavaScript syntax
        run: |
          find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0 \
            | xargs -0 -n1 node --check

      # Every JSON and webmanifest file must parse.
      - name: JSON syntax
        run: |
          for f in $(find . \( -name '*.json' -o -name '*.webmanifest' \) -not -path './.git/*'); do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "Bad JSON: $f"; exit 1; }
          done

      # sitemap.xml must be well-formed.
      - name: Sitemap
        run: |
          sudo apt-get install -y -qq libxml2-utils >/dev/null
          xmllint --noout storefront/sitemap.xml

      # Every local file an HTML page links to must exist.
      - name: Local links
        run: |
          node - <<'EOF'
          const fs = require('fs'), path = require('path');
          const pages = [];
          (function walk(d) {
            for (const e of fs.readdirSync(d, { withFileTypes: true })) {
              if (e.name === '.git' || e.name === 'node_modules') continue;
              const p = path.join(d, e.name);
              if (e.isDirectory()) walk(p); else if (p.endsWith('.html')) pages.push(p);
            }
          })('.');
          let bad = 0;
          for (const page of pages) {
            const html = fs.readFileSync(page, 'utf8');
            for (const m of html.matchAll(/(?:src|href)=["']([^"'#?]+)/g)) {
              const ref = m[1];
              if (/^([a-z]+:|\/\/|data:|mailto:|tel:)/i.test(ref) || ref.includes('${')) continue;
              const target = ref.startsWith('/')
                ? path.join(path.dirname(page).startsWith('storefront') ? 'storefront' : '.', ref)
                : path.join(path.dirname(page), ref);
              const ok = fs.existsSync(target) || fs.existsSync(path.join(target, 'index.html'));
              if (!ok) { console.log(`${page}: missing ${ref}`); bad++; }
            }
          }
          console.log(`${pages.length} pages checked, ${bad} missing links`);
          process.exit(bad ? 1 : 0);
          EOF

      - name: No secrets in the repo
        run: |
          if grep -rEl --exclude-dir=.git --exclude-dir=.github '(sk_live_|sk_test_|SUPABASE_SERVICE_ROLE|BEGIN [A-Z ]*PRIVATE KEY)' .; then
            echo "Possible secret found"; exit 1
          fi
